name: linksense
description: Flutter plugin for LinkSense dynamic links and deferred deep linking on iOS and Android.
version: 0.1.0
homepage: https://linksense.net
repository: https://github.com/jankokalj/linksense-flutter
issue_tracker: https://github.com/jankokalj/linksense-flutter/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SwiftLinksensePlugin
        sharedDarwinSource: true
      android:
        package: net.linksense.flutter
        pluginClass: LinksensePlugin
