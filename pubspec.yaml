name: linksense
description: Flutter plugin for LinkSense dynamic links and deferred deep linking on iOS and Android.
version: 0.2.0
homepage: https://linksense.net
repository: https://github.com/LinkSense-net/linksense-flutter
issue_tracker: https://github.com/LinkSense-net/linksense-flutter/issues

topics:
  - deep-linking
  - dynamic-links
  - attribution
  - app-links
  - linksense

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SwiftLinksensePlugin
      android:
        package: net.linksense.flutter
        pluginClass: LinksensePlugin
